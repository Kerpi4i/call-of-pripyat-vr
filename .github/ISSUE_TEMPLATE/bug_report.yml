name: Alpha bug report / Помилка альфи
description: Report a reproducible CoPVR problem
title: "[Alpha] "
body:
  - type: input
    id: version
    attributes:
      label: Mod version / Версія
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Hardware and runtime / Обладнання
      description: Headset, controllers, Link method, OpenXR runtime, GPU/driver, Windows
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps, expected result, actual result / Кроки та результат
    validations:
      required: true
  - type: dropdown
    id: clean
    attributes:
      label: Reproduces on clean install? / Повторюється на чистій установці?
      options:
        - Not tested / Не перевірено
        - Yes / Так
        - No / Ні
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, video / Журнали та зображення
      description: Review usernames and local paths before sharing. Do not upload game archives.
